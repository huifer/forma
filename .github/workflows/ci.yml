name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (locked)
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked

  lint:
    name: fmt & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # RFC 治理：docs/architecture 下的受管文档（RFC / ADR / Spec）必须通过 forma docs validate。
  # 这是治理契约的机器防线——ID 唯一、状态合法、依赖引用存在、无非法循环依赖。
  docs:
    name: governance docs (RFC/ADR/Spec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate governance docs
        run: cargo run --locked -- docs validate
      - name: Lint governance docs (template sections)
        run: cargo run --locked -- docs lint
      - name: Check capabilities (registry / dependencies / compatibility)
        # capability check 需要工程目录（根目录无 forma.yaml）；用旗舰示例作为受管工程
        run: cargo run --locked -- capability check examples/school
      - name: Check internal links
        run: cargo run --locked -- docs check-links
      - name: Check document dependencies
        run: cargo run --locked -- docs check-dependencies
      - name: Detect specification compatibility changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            BASE="origin/$GITHUB_BASE_REF"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            BASE="HEAD^"
          else
            BASE="HEAD"
          fi
          cargo run --locked -- docs check-compatibility --base "$BASE"

  # 案例协议 V9/V15：生成的 Flutter 工程必须 analyze 干净 + 契约测试通过。
  # 在线用例在后端不可达时自动跳过，因此这里不需要数据库。
  flutter:
    name: flutter contract (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze
        working-directory: examples/school/app_mobile
        run: |
          flutter pub get
          flutter analyze
      - name: Contract tests (offline roundtrips; live cases auto-skip)
        working-directory: examples/school/app_mobile
        run: flutter test

  # P3/C-3：生成的 Rust 后端必须真实编译（L3 验证门的 CI 落点）。
  # P2 轨道 A-2 曾抓出 6 类「cargo test 全绿但生成后端编译不过」的错误：
  #   school 覆盖 auth + 命令 + 无租户列组合，access-depth 覆盖两层关系遍历守卫。
  generated-backend:
    name: generated rust backend (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate artifacts (school + access-depth)
        run: |
          cargo run --locked -- build examples/school
          cargo run --locked -- build examples/access-depth
      - name: Compile generated school backend
        working-directory: examples/school/generated/backend
        run: cargo check
      - name: Compile generated access-depth backend
        working-directory: examples/access-depth/generated/backend
        run: cargo check

  # 生成的 Docker 产物必须可构建（deployability 门）。
  # 干净环境才暴露的两个问题：COPY Cargo.lock（emitter 不产出，已改 cargo fetch）
  # 与 rust:1.83 基础镜像过旧（依赖要求 edition2024，已升 rust:1-slim）。
  docker:
    name: generated backend docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate artifacts
        run: cargo run --locked -- build examples/school
      - name: Build backend image
        working-directory: examples/school
        run: docker build -f generated/backend/Dockerfile -t forma-school-test .

  # 案例协议 V16：生成的 React Web 必须通过 tsc 与 vite 生产构建。
  web:
    name: generated web (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate artifacts
        run: cargo run --locked -- build examples/school
      - name: Type check
        working-directory: examples/school/generated/web
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
      # F-004：规则一致性向量 · Web 端行为验证（与 Flutter 端同源派生）
      - name: Behavior vector tests (vitest)
        working-directory: examples/school/generated/web
        run: npx vitest run
      - name: Production build
        working-directory: examples/school/generated/web
        run: npm run build
      # P1-6：cursor-pagination reference app 验证 keyset emitter、Web useInfiniteQuery 与 OpenAPI envelope。
      - name: Generate cursor pagination reference app
        run: cargo run --locked -- build examples/cursor-pagination
      - name: Type check and production build (cursor pagination)
        working-directory: examples/cursor-pagination/generated/web
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
      - name: Compile generated cursor backend
        working-directory: examples/cursor-pagination/generated/backend
        run: cargo check

  # RFC-0010 V0.6：AntV（G2Plot）adapter 生成产物验证（npm install + tsc）
  viz-antv:
    name: generated web with AntV adapter (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate artifacts
        run: cargo run --locked -- build examples/viz-antv
      - name: Type check
        working-directory: examples/viz-antv/generated/web
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

  # 案例协议 V14：真实 MySQL 8 端到端——迁移链 + 种子数据 + 后端 + API 冒烟
  # （list/filter/search/create/validation-error/guard）。这是历史上抓出 8 类
  # 生成器运行时 bug 的那道防线，必须留在 CI。
  e2e:
    name: end-to-end (MySQL 8 + backend + API)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: forma123
          MYSQL_DATABASE: school
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pforma123"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Generate artifacts
        run: cargo run --locked -- build examples/school
      - name: Apply migration chain + seed
        working-directory: examples/school
        run: |
          # 应用**全部** upgrade（0004 建 users/audit_logs，0005 加 idempotency_key）——
          # 旧脚本只列了 0001-0003，后端启动后 auth/audit 查询会因缺表失败。
          for f in db/migrations/*_init.sql db/migrations/*_upgrade.sql; do
            mysql -h 127.0.0.1 -P 3307 -uroot -pforma123 school < "$f"
          done
          mysql -h 127.0.0.1 -P 3307 -uroot -pforma123 school < db/seed/seed_0_3_0.sql
      - name: Run backend
        working-directory: examples/school/generated/backend
        run: |
          # generated/ 被 gitignore，emitter 不产出 Cargo.lock；--locked 在干净 checkout 上必然失败。
          cargo build
          DATABASE_URL="mysql://root:forma123@127.0.0.1:3307/school" \
            ./target/debug/school-backend &> /tmp/backend.log &
          # /health 是公开探针；/api/* 实体路由在 require_auth 之后（无 token → 401）
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health > /dev/null && break
            sleep 1
          done
      - name: API smoke (auth / list / search / create / validation / guard)
        run: |
          B=http://127.0.0.1:8080/api
          # 实体路由在 require_auth 之后：先注册 + 登录拿 admin token
          # （注册冲突 409 也接受，保证幂等）
          REG=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/auth/register" \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-e2e","password":"ci-e2e-secret","role":"admin"}')
          test "$REG" = "200" -o "$REG" = "409"
          TOKEN=$(curl -s -X POST "$B/auth/login" -H 'Content-Type: application/json' \
            -d '{"username":"ci-e2e","password":"ci-e2e-secret"}' \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          AUTH="Authorization: Bearer $TOKEN"
          # 列表（含 JOIN 显示列）
          curl -sf "$B/students?page_size=2" -H "$AUTH" | grep -q school_name
          # 搜索（LIKE + 三值逻辑 COALESCE）
          curl -sf "$B/students?q=student0" -H "$AUTH" | grep -q student0
          # 过滤（FK 列）
          SCHOOL=$(curl -s "$B/schools" -H "$AUTH" | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['id'])")
          curl -sf "$B/students?school=$SCHOOL" -H "$AUTH" | grep -q "$SCHOOL"
          # 创建（关系载荷）
          curl -sf -X POST "$B/schools" -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"name":"CI School","city":"CI"}' | grep -q '"ok":true'
          # 规则校验失败 → 400 + fields
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/students" -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d "{\"school\":\"$SCHOOL\",\"name\":\"x\",\"email\":\"ci-$GITHUB_RUN_ID@example.test\",\"age\":2}")
          test "$CODE" = "400"
          # 守卫：删除已结课报名 → 409
          ENR=$(curl -s "$B/enrollments" -H "$AUTH" | python3 -c "import sys,json;print([e['id'] for e in json.load(sys.stdin) if e['status']=='completed'][0])")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "$B/enrollments/$ENR" -H "$AUTH")
          test "$CODE" = "409"

  # 轨道 B / M10 扩栈目标此前只有结构断言，没有生成工程编译门。
  # 该 job 用目标语言真实工具链验证 7 个可编译 target（Go/PHP/Python/proto/TS/JSON）；
  # 脚本会显式列出无法在 CI 验证的范围，不静默跳过。
  l3-smoke:
    name: generated extension targets (L3 compile smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build compiler
        run: cargo build --locked
      - name: Compile generated opt-in targets
        run: bash scripts/l3-smoke.sh
      - name: Verify no benchmark fixtures leaked into the workspace
        run: |
          if [ -n "$(ls -d F008-* 2>/dev/null)" ]; then
            echo "::error::forma bench left F008-* case projects in the repository root"
            exit 1
          fi
