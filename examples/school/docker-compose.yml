# @generated by Forma (gen-docker) — do not edit manually.
# docker-compose up --build → 启动 MySQL + backend + Web dev server

services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD (compose 不内嵌默认口令)}
      MYSQL_DATABASE: school
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: generated/backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}@db:3306/school
      DB_HOST: db
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      DB_NAME: school
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./generated/web:/app
    environment:
      VITE_API_BASE: http://backend:8080/api
    depends_on:
      - backend

volumes:
  db_data:
