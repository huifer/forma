[package]
name = "forma"
version = "0.3.0"
edition = "2021"
description = "A Rust specification compiler that turns one declarative DSL into database migrations, backend code, frontend code, APIs, validation, and diagrams."
license = "MIT"
repository = "https://github.com/huifer/forma"
readme = "../../README.md"
keywords = ["dsl", "compiler", "code-generation", "database-migrations", "ai-coding"]
categories = ["command-line-utilities", "development-tools", "compilers"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
anyhow = "1"

[[bin]]
name = "forma"
path = "src/main.rs"

[lib]
name = "forma"
path = "src/lib.rs"
